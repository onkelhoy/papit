<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webrtc demo</title>

    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <header>
        <h1>@papit/webrtc</h1>
        <span id="status" class="badge" data-state="offline">offline</span>
        <span id="whoami" class="muted"></span>
    </header>

    <main>
        <!-- not in a network -->
        <div id="lobby" class="columns">
            <section id="connection" class="card">
                <h2>Connection</h2>
                <label>Server URL <input id="url" value="ws://localhost:3000" spellcheck="false" /></label>
                <label>Display name <input id="display-name" maxlength="40" placeholder="how others see you" /></label>
                <label class="inline"><input id="stun" type="checkbox" checked /> public STUN server (needed across networks)</label>
                <div class="row">
                    <button id="connect" class="primary">Connect</button>
                    <button id="disconnect">Disconnect</button>
                </div>
                <p class="hint">A server on a free host may sleep. The badge shows "waking up server…" while it boots.</p>
            </section>

            <section id="create" class="card">
                <h2>Create a network</h2>
                <div class="grid2">
                    <label>Name <input id="network-name" value="lobby" maxlength="64" /></label>
                    <label>Topology
                        <select id="topology">
                            <option value="mesh">mesh</option>
                            <option value="star">star</option>
                            <option value="chord">chord</option>
                        </select>
                    </label>
                    <label>Password <input id="create-password" type="password" placeholder="optional" /></label>
                    <label class="inline end"><input id="private" type="checkbox" /> private (hidden from the list)</label>
                </div>
                <div id="create-plan"></div>
                <button id="create-button" class="primary">Create</button>
            </section>

            <section id="join" class="card">
                <h2>Join a network</h2>
                <div class="row">
                    <button id="refresh">Refresh list</button>
                    <input id="join-password" type="password" placeholder="password, if needed" />
                </div>
                <ul id="networks" class="list"><li class="empty">connect and refresh to see public networks</li></ul>
                <div class="row">
                    <input id="network-id" placeholder="or paste a network id (private networks)" spellcheck="false" />
                    <button id="join-id">Join</button>
                </div>
            </section>
        </div>

        <!-- in a network -->
        <div id="room" class="columns" hidden>
            <section class="card" id="room-info">
                <div class="row between">
                    <h2 id="room-title">network</h2>
                    <div class="row">
                        <button id="edit-plan" hidden>Edit media plan</button>
                        <button id="leave" class="danger">Leave</button>
                    </div>
                </div>
                <p id="room-meta" class="muted"></p>
                <form id="rename" class="row">
                    <input id="room-name" maxlength="40" placeholder="your display name" />
                    <button>Rename</button>
                </form>
                <h3>Members</h3>
                <ul id="members" class="list"></ul>
            </section>

            <section class="card wide" id="streams">
                <h2>Streams</h2>
                <div id="stream-controls" class="row"></div>
                <div id="grid"></div>
            </section>

            <section class="card wide" id="channels">
                <h2>Channels</h2>
                <nav id="tabs" role="tablist"></nav>
                <div id="tab-panel">
                    <ol id="tab-log" class="log"></ol>
                    <form id="tab-send" class="row">
                        <select id="tab-target"></select>
                        <input id="tab-text" placeholder="message" autocomplete="off" />
                        <button class="primary">Send</button>
                    </form>
                    <p id="tab-hint" class="hint"></p>
                </div>
            </section>
        </div>

        <section id="events" class="card">
            <div class="row between">
                <h2>Event log</h2>
                <div class="row">
                    <label class="inline"><input id="verbose" type="checkbox" /> debug</label>
                    <button id="clear">Clear</button>
                </div>
            </div>
            <ol id="log" class="log"></ol>
        </section>
    </main>

    <dialog id="plan-dialog">
        <form method="dialog">
            <h2>Edit media plan</h2>
            <div id="edit-plan-editor"></div>
            <div class="row end">
                <button value="cancel">Cancel</button>
                <button id="save-plan" value="save" class="primary">Update everyone</button>
            </div>
        </form>
    </dialog>

    <template id="plan-editor">
        <div class="plan">
            <div class="row presets">
                <span class="muted">Presets:</span>
                <button type="button" data-preset="chat">Chat</button>
                <button type="button" data-preset="call">Video call</button>
                <button type="button" data-preset="game">Game</button>
                <button type="button" data-preset="screen">Screen share</button>
                <button type="button" data-preset="none">Empty</button>
            </div>

            <h3>Channels <small class="muted">labels can't start with "_"; that's reserved, e.g. for <code>_system</code></small></h3>
            <table class="rows channels">
                <thead><tr><th>label</th><th>ordered</th><th>reliability</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
            <button type="button" class="add-channel">+ channel</button>

            <h3>Streams</h3>
            <table class="rows streams">
                <thead><tr><th>name</th><th>kind</th><th>screen</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
            <button type="button" class="add-stream">+ stream</button>

            <p class="plan-error error" hidden></p>
        </div>
    </template>
</body>

</html>
