<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webrtc demo</title>
    <style>
        [hidden] { display: none !important; }
        body { font: 14px/1.4 system-ui, sans-serif; margin: 1rem; max-width: 64rem; }
        fieldset { margin: 0 0 1rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
        label { display: grid; gap: .2rem; }
        input[type=text], input:not([type]) { min-width: 12rem; }
        input[type=number] { width: 5rem; }
        textarea { width: 100%; font: 11px monospace; }
        code { background: #8882; padding: 0 .3rem; }
        section.network { border: 1px solid #8886; border-radius: .4rem; padding: .5rem 1rem; margin: 0 0 1rem; }
        section.network h2 { font-size: 1rem; margin: .2rem 0 .5rem; }
        section.network fieldset { border-style: dashed; }
        #log { height: 18rem; overflow: auto; background: #8881; padding: .5rem; font: 12px monospace; white-space: pre-wrap; }
        .error { color: #c33; }
        .debug { color: #888; }
    </style>
    <script type="module" src="main.js"></script>
</head>

<body>
    <h1>webrtc</h1>

    <fieldset>
        <legend>Server</legend>
        <label>URL <input id="url" value="ws://localhost:3000" spellcheck="false"></label>
        <label><span><input id="stun" type="checkbox" checked> public STUN</span></label>
        <label><span><input id="verbose" type="checkbox"> debug log</span></label>
        <span>me <code id="me">not connected</code> · socket <b id="online">closed</b></span>
    </fieldset>

    <fieldset id="start">
        <legend>New network on the server</legend>
        <label>Name <input id="name" value="lobby"></label>
        <label>Topology
            <select id="topology">
                <option>mesh</option>
                <option>star</option>
                <option>multicast</option>
                <option>chord</option>
            </select>
        </label>
        <label>Anchors <input id="anchors" type="number" min="1" value="1"></label>
        <label>Beacon ms <input id="beacon" type="number" min="0" step="1000" value="10000"></label>
        <label>Password <input id="password" placeholder="optional"></label>
        <button id="create">Create</button>
        <label>Network id <input id="network" placeholder="paste an id"></label>
        <button id="join">Join</button>
    </fieldset>

    <div id="networks"></div>

    <template id="panel">
        <section class="network">
            <h2><span data-name></span> <code data-id></code> · <span data-topology></span></h2>
            <div>
                anchor <b data-anchored></b> · <span data-over></span> ·
                <a data-link target="_blank">open a joining tab</a><br>
                links <span data-links></span><br>
                known <span data-known></span>
            </div>

            <fieldset>
                <legend>Send</legend>
                <label>To <select data-to></select></label>
                <label>Text <input data-text value="hej"></label>
                <button data-send>Send</button>
            </fieldset>

            <fieldset>
                <legend>Carry a network over this one</legend>
                <label>Name <input data-carry-name value="game"></label>
                <label>Topology
                    <select data-carry-topology>
                        <option>mesh</option>
                        <option>star</option>
                        <option>multicast</option>
                        <option>chord</option>
                    </select>
                </label>
                <button data-carry-create>Create over this network</button>
                <label>Invite (JSON) <input data-carry-invite placeholder="paste an invite"></label>
                <button data-carry-join>Join over this network</button>
            </fieldset>

            <fieldset>
                <legend>Invite</legend>
                <textarea data-invite rows="2" readonly></textarea>
            </fieldset>

            <fieldset>
                <legend>Merge (anchors only)</legend>
                <label>Into network id <input data-merge-id></label>
                <label>Password <input data-merge-password placeholder="optional"></label>
                <button data-merge>Merge into</button>
                <button data-leave>Leave</button>
            </fieldset>
        </section>
    </template>

    <div id="log"></div>
</body>

</html>
