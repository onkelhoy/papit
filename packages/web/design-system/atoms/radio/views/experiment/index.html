<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>Radio | experiment</h1>
    <section>
        <h2>Example</h2>
        <pap-codeblock>
            <pap-radio>Label</pap-radio>
        </pap-codeblock>
    </section>


    <section>
        <h2>Group</h2>
        <pap-codeblock>
            <pap-group aria-orientation="vertical">
                <pap-radio name="radio">Radio 1</pap-radio>
                <pap-radio name="radio">Radio 2</pap-radio>
                <pap-radio name="radio">Radio 3</pap-radio>
                <pap-radio name="radio">Radio 4</pap-radio>
            </pap-group>
        </pap-codeblock>
    </section>
</body>

</html>
