<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>Tabs | experiment</h1>
    <section>
        <h2>Example</h2>
        <pap-codeblock>
            <pap-tabs>
                <pap-tab value="hello">Hello</pap-tab>
                <pap-tab value="world">World</pap-tab>
                <pap-tab value="foo">Foo</pap-tab>
                <pap-tab value="bar">Bar</pap-tab>

                <pap-tabpanel value="hello">Im the content of Hello</pap-tabpanel>
                <pap-tabpanel value="world">Im the content of World</pap-tabpanel>
                <pap-tabpanel value="foo">Im the content of Foo</pap-tabpanel>
                <pap-tabpanel value="bar">Im the content of Bar</pap-tabpanel>
            </pap-tabs>
        </pap-codeblock>
    </section>

    <section>
        <h2>Vertical</h2>
        <pap-codeblock>
            <pap-tabs aria-orientation="vertical">
                <pap-tab value="hello">Hello</pap-tab>
                <pap-tab value="world">World</pap-tab>
                <pap-tab value="foo">Foo</pap-tab>
                <pap-tab value="bar">Bar</pap-tab>

                <pap-tabpanel value="hello">Im the content of Hello</pap-tabpanel>
                <pap-tabpanel value="world">Im the content of World</pap-tabpanel>
                <pap-tabpanel value="foo">Im the content of Foo</pap-tabpanel>
                <pap-tabpanel value="bar">Im the content of Bar</pap-tabpanel>
            </pap-tabs>
        </pap-codeblock>
    </section>
</body>

</html>
