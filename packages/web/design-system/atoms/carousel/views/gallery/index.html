<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarouselGallery | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>CarouselGallery | experiment</h1>
    <section>
        <h2>With Loop</h2>
        <pap-codeblock>
            <pap-carousel-gallery>
                <div class="img-container">
                    <img src="https://images.pexels.com/photos/66863/goose-water-bird-nature-bird-66863.jpeg" />
                </div>
                <div class="img-container">
                    <img src="https://wallpapers.com/images/featured/goose-zwk5zry3xu16tw21.jpg" />
                </div>
                <div class="img-container">
                    <img
                        src="https://thumbs.dreamstime.com/b/three-white-geese-walking-gravel-path-blurred-green-background-406331638.jpg" />
                </div>
                <div class="img-container">
                    <img
                        src="https://t3.ftcdn.net/jpg/04/80/35/14/360_F_480351411_L3G320Xc1pmD8pKMcMcZv2kqkJUlpPQr.jpg" />
                </div>
                <div class="img-container">
                    <img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwZg0s3DJ8hRhtXVCk8x5Oju_DrSVlvI6OLg&s" />
                </div>
                <div class="img-container">
                    <img src="https://wallpapers.com/images/hd/sweet-flock-of-geese-e8z8mtmdzyu1r8vh.jpg" />
                </div>
            </pap-carousel-gallery>
        </pap-codeblock>
    </section>

    <section>
        <h2>Without loop</h2>
        <pap-codeblock>
            <pap-carousel-gallery loop="false">
                <div class="img-container">
                    <img src="https://images.pexels.com/photos/66863/goose-water-bird-nature-bird-66863.jpeg" />
                </div>
                <div class="img-container">
                    <img src="https://wallpapers.com/images/featured/goose-zwk5zry3xu16tw21.jpg" />
                </div>
                <div class="img-container">
                    <img
                        src="https://thumbs.dreamstime.com/b/three-white-geese-walking-gravel-path-blurred-green-background-406331638.jpg" />
                </div>
                <div class="img-container">
                    <img
                        src="https://t3.ftcdn.net/jpg/04/80/35/14/360_F_480351411_L3G320Xc1pmD8pKMcMcZv2kqkJUlpPQr.jpg" />
                </div>
                <div class="img-container">
                    <img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwZg0s3DJ8hRhtXVCk8x5Oju_DrSVlvI6OLg&s" />
                </div>
                <div class="img-container">
                    <img src="https://wallpapers.com/images/hd/sweet-flock-of-geese-e8z8mtmdzyu1r8vh.jpg" />
                </div>
            </pap-carousel-gallery>
        </pap-codeblock>
    </section>
    <section>
        <h2>Driven by slide (no carousel)</h2>
        <p>The gallery only shows <code>slide</code>. Any number works: with loop it wraps, without it clamps.</p>
        <pap-codeblock>
            <pap-carousel-gallery id="looped">
                <div class="card">One</div>
                <div class="card">Two</div>
                <div class="card">Three</div>
                <div class="card">Four</div>
                <div class="card">Five</div>
            </pap-carousel-gallery>
            <div class="toolbar">
                <button onclick="looped.slide--">slide--</button>
                <button onclick="looped.slide = 7">slide = 7</button>
                <button onclick="looped.slide++">slide++</button>
            </div>
        </pap-codeblock>
        <pap-codeblock>
            <pap-carousel-gallery id="clamped" loop="false">
                <div class="card">One</div>
                <div class="card">Two</div>
                <div class="card">Three</div>
                <div class="card">Four</div>
                <div class="card">Five</div>
            </pap-carousel-gallery>
            <div class="toolbar">
                <button onclick="clamped.slide--">slide--</button>
                <button onclick="clamped.slide = 7">slide = 7</button>
                <button onclick="clamped.slide++">slide++</button>
            </div>
        </pap-codeblock>
    </section>

    <section>
        <h2>Several per view (align start)</h2>
        <pap-codeblock>
            <pap-carousel-gallery class="bleed" align="start" loop="false">
                <div class="card">One</div>
                <div class="card">Two</div>
                <div class="card">Three</div>
                <div class="card">Four</div>
                <div class="card">Five</div>
            </pap-carousel-gallery>
        </pap-codeblock>
    </section>
</body>

</html>
