<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carousel test</title>

    <style>
        .slide {
            height: 120px;
        }

        #bleed pap-carousel-gallery {
            --size: 30%;
        }

        #bleed pap-carousel-gallery::part(carousel) {
            padding-inline: 40px;
            scroll-padding-inline: 40px;
        }
    </style>

    <script type="module" defer src="main.js"></script>
</head>

<body>
    <!-- carousel with its controls inside, looping -->
    <pap-carousel id="basic" aria-label="Basic" data-testid="basic">
        <pap-carousel-gallery>
            <div class="slide">One</div>
            <div class="slide">Two</div>
            <div class="slide">Three</div>
        </pap-carousel-gallery>
        <div>
            <pap-carousel-prev data-testid="basic-prev"></pap-carousel-prev>
            <pap-carousel-dots data-testid="basic-dots"></pap-carousel-dots>
            <pap-carousel-next data-testid="basic-next"></pap-carousel-next>
        </div>
    </pap-carousel>

    <!-- no loop -->
    <pap-carousel id="noloop" loop="false" aria-label="No loop" data-testid="noloop">
        <pap-carousel-gallery>
            <div class="slide">A</div>
            <div class="slide">B</div>
            <div class="slide">C</div>
        </pap-carousel-gallery>
    </pap-carousel>

    <!-- autoplay with a short duration -->
    <pap-carousel id="auto" autoplay duration="400" aria-label="Autoplay" data-testid="auto">
        <pap-carousel-gallery>
            <div class="slide">1</div>
            <div class="slide">2</div>
            <div class="slide">3</div>
        </pap-carousel-gallery>
    </pap-carousel>

    <!-- controls outside the carousel, named by aria-controls -->
    <pap-carousel id="outside" aria-label="Outside" data-testid="outside">
        <pap-carousel-gallery>
            <div class="slide">X</div>
            <div class="slide">Y</div>
            <div class="slide">Z</div>
        </pap-carousel-gallery>
    </pap-carousel>
    <pap-carousel-prev aria-controls="outside" data-testid="outside-prev"></pap-carousel-prev>
    <pap-carousel-next aria-controls="outside" data-testid="outside-next"></pap-carousel-next>

    <!-- your own controls, through the API -->
    <pap-carousel id="custom" aria-label="Custom" data-testid="custom">
        <pap-carousel-gallery>
            <div class="slide">P</div>
            <div class="slide">Q</div>
            <div class="slide">R</div>
        </pap-carousel-gallery>
        <button data-testid="custom-next" aria-controls="custom" onclick="custom.next()">next</button>
        <button data-testid="custom-first" aria-controls="custom" onclick="custom.slide = 0">first</button>
    </pap-carousel>

    <!-- "bleed": several per view, start-aligned to a padded gutter -->
    <pap-carousel id="bleed" loop="false" aria-label="Bleed" data-testid="bleed">
        <pap-carousel-gallery align="start">
            <div class="slide">B1</div>
            <div class="slide">B2</div>
            <div class="slide">B3</div>
            <div class="slide">B4</div>
            <div class="slide">B5</div>
            <div class="slide">B6</div>
            <div class="slide">B7</div>
            <div class="slide">B8</div>
        </pap-carousel-gallery>
        <pap-carousel-dots data-testid="bleed-dots"></pap-carousel-dots>
    </pap-carousel>
</body>

</html>
