<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input test</title>

    <script type="module" defer src="main.js"></script>
</head>

<body>
    <pap-input data-testid="base-target">
        fallback
    </pap-input>

    <pap-input data-testid="format-target" format="(xxx) xxx-xxxx"></pap-input>

    <pap-input data-testid="clear-target" clear></pap-input>

    <pap-input data-testid="password-target" type="password"></pap-input>

    <form>
        <pap-input data-testid="reset-target" name="reset-field" defaultvalue="default"></pap-input>
        <button type="reset" data-testid="reset-button">Reset</button>
    </form>

    <form>
        <pap-input data-testid="required-target" name="required-field" required></pap-input>
    </form>

    <form data-testid="property-form"></form>

    <pap-input data-testid="label-target" aria-label="Search"></pap-input>

    <span id="labelledby-text">Search</span>
    <span id="describedby-text">Find anything</span>
    <pap-input data-testid="labelledby-target" aria-labelledby="labelledby-text" aria-describedby="describedby-text"></pap-input>

    <label for="for-target">Search</label>
    <pap-input id="for-target" data-testid="for-target"></pap-input>

    <form data-testid="submit-form">
        <pap-input data-testid="submit-target" name="q"></pap-input>
    </form>
</body>

</html>
