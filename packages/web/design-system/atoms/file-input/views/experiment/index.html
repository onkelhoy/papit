<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileInput | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>FileInput | experiment</h1>
    <section>
        <h2>Example</h2>
        <pap-codeblock>
            <pap-file-input multiple></pap-file-input>
        </pap-codeblock>
    </section>

    <section>
        <h2>Dropzone</h2>
        <pap-codeblock>
            <pap-file-input multiple dropzone></pap-file-input>
        </pap-codeblock>
    </section>

    <section>
        <h2>Indicator</h2>
        <pap-codeblock>
            <pap-file-input multiple indicator></pap-file-input>
        </pap-codeblock>
    </section>

    <section>
        <h2>Dropzone + Indicator</h2>
        <pap-codeblock>
            <pap-file-input multiple indicator dropzone></pap-file-input>
        </pap-codeblock>
    </section>

    <section>
        <h2>Disabled</h2>
        <pap-codeblock>
            <pap-file-input disabled multiple indicator dropzone></pap-file-input>
        </pap-codeblock>
    </section>
</body>

</html>
