<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>Checkbox | experiment</h1>
    <section>
        <h2>Example</h2>
        <pap-codeblock>
            <pap-checkbox></pap-checkbox>
            <pap-checkbox checked></pap-checkbox>
            <pap-checkbox indeterminate></pap-checkbox>
        </pap-codeblock>
    </section>

    <section>
        <h2>Nested</h2>
        <pap-codeblock>
            <pap-checkbox aria-controls="a b c"></pap-checkbox>
            <pap-checkbox id="a"></pap-checkbox>
            <pap-checkbox id="b"></pap-checkbox>
            <pap-checkbox id="c"></pap-checkbox>
        </pap-codeblock>
    </section>
</body>

</html>
