<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>popover test</title>

    <script type="module" defer src="main.js"></script>
</head>

<body>
    <pap-popover data-testid="base-target">
        fallback
    </pap-popover>

    <button data-testid="escape-trigger" popovertarget="escape-popover">open</button>
    <pap-popover id="escape-popover" data-testid="escape-popover">
        <button data-testid="escape-inner">inside</button>
    </pap-popover>
</body>

</html>
