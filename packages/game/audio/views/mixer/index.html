<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio | mixer</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>Audio | mixer</h1>
    <p>state: <output id="state">locked</output></p>

    <section>
        <h2>Biome</h2>
        <div class="row" id="biomes">
            <pap-button data-biome="forest">forest</pap-button>
            <pap-button data-biome="desert">desert</pap-button>
            <pap-button data-biome="cave">cave</pap-button>
            <pap-button data-biome="">silence</pap-button>
        </div>
        <label>fade <input id="seconds" type="range" min="0" max="8" step="0.1" value="2"> <output for="seconds">2</output>s</label>
        <label>curve
            <select id="curve">
                <option>equal-power</option>
                <option>linear</option>
                <option>ease-in</option>
                <option>ease-out</option>
                <option>ease-in-out</option>
            </select>
        </label>
    </section>

    <section>
        <h2>Sound effect</h2>
        <pap-button id="sfx">play blip</pap-button>
    </section>

    <section>
        <h2>Buses</h2>
        <label>master <input data-bus="master" type="range" min="0" max="1" step="0.01" value="1"></label>
        <label>music <input data-bus="music" type="range" min="0" max="1" step="0.01" value="1"></label>
        <label>sfx <input data-bus="sfx" type="range" min="0" max="1" step="0.01" value="1"></label>
        <label><pap-switch id="mute"></pap-switch> mute music</label>
    </section>
</body>

</html>
