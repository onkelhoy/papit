<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh | skin</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" defer src="main.js"></script>
</head>

<body>
    <canvas aria-label="skinned tentacle, drag to orbit">Your browser does not support HTML canvas</canvas>
    <form class="controls">
        <label><input type="checkbox" name="animate" checked> play animation</label>
        <label><input type="checkbox" name="weights"> show weights</label>
        <label><input type="checkbox" name="bones" checked> show bones</label>
        <label>bend <input type="range" name="bend" min="-1" max="1" step="0.01" value="0.4"></label>
        <label>twist <input type="range" name="twist" min="-1" max="1" step="0.01" value="0"></label>
    </form>
</body>

</html>
