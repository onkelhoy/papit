name: pages

# Builds the showcase site (npm run showcase + showcase:static) and deploys it to GitHub Pages.
# Pages serves the uploaded artifact (dist/showcase), so any folder works, not only docs/.
# Needs Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare tools
        env:
          CI: true
        run: npm run prebuild --if-present

      - name: Build
        env:
          CI: true
        run: npm run build

      - name: Generate the showcase
        env:
          CI: true
        run: npm run showcase

      - name: Publish as a static site
        env:
          CI: true
        # a project page lives under /<repo>/
        run: npm run showcase:static -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/showcase

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
